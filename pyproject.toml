[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jinshu_harness"
version = "2.0.0"
description = "Enterprise-grade Multi-Agent Evaluation Harness for Jin-Shu OS"
authors = [
  { name = "Han Li", email = "hanli@example.com" }
]
readme = "harness/AGENTS.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.1,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.28.0,<2.0.0",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools]
packages = ["harness", "engine"]

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["harness/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E402",
]


