version: "3.8"

services:
  jinshu-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jinshu-os-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./finetune:/app/finetune
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
